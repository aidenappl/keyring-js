commands:
    - name: build
      description: Build the package (tsup → dist/)
      run: npm run build
      syncAfter: false
    - name: check
      description: Typecheck (tsc --noEmit)
      run: npm run check
      syncAfter: false
    - name: test
      description: Run tests (vitest run)
      run: npm test
      syncAfter: false
    - name: install
      description: Install dependencies
      run: npm install
      syncAfter: false
